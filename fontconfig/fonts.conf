<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="antialias"      mode="assign"><bool>true</bool></edit>
    <edit name="hinting"        mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"      mode="assign"><const>hintnone</const></edit>
    <edit name="autohint"       mode="assign"><bool>false</bool></edit>
    <edit name="rgba"           mode="assign"><const>none</const></edit>
    <edit name="lcdfilter"      mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Helvetica Neue</family>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Times New Roman</family>
      <family>Noto Serif</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>SF Mono</family>
      <family>Noto Sans Mono</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>-apple-system</family>
    <prefer><family>SF Pro Text</family><family>SF Pro Display</family></prefer>
  </alias>
  <alias binding="strong">
    <family>BlinkMacSystemFont</family>
    <prefer><family>SF Pro Text</family><family>SF Pro Display</family></prefer>
  </alias>
  <alias binding="strong">
    <family>-apple-system-body</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>

  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>SF Pro Text</family><family>SF Pro Display</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-serif</family>
    <prefer><family>Times New Roman</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer><family>SF Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-rounded</family>
    <prefer><family>SF Pro Rounded</family><family>SF Compact Rounded</family></prefer>
  </alias>

  <alias binding="strong">
    <family>SFMono-Regular</family>
    <prefer><family>SF Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Menlo</family>
    <prefer><family>SF Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Monaco</family>
    <prefer><family>SF Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica Neue</family>
    <prefer><family>SF Pro Text</family><family>SF Pro Display</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>
</fontconfig>
